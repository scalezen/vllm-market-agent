# TTFT vs prompt length, prefill arm, default engine, Gemma 4 E2B (text-only, 4-bit).
# Quote strings: YAML reads unquoted ON/NO/YES/OFF as booleans.

server:
  model: "mlx-community/Gemma4-E2B-IT-Text-int4"
  tool_call_parser: "gemma4"
  reasoning_parser: "gemma4"
  serve_script: "benchmarks/serve.sh"
  ready_timeout_s: 300
  continuous_batching: false
  max_num_seqs: null            # needs continuous_batching
  prefix_cache: false           # true also drops the per-request cache-busting id
  kv_cache_quantization: false  # only takes effect with continuous_batching + prefix_cache
  kv_cache_quantization_bits: null

prompt:
  ticker: "WMT"
  signal_file: "data/raw/WMT_news.parquet"
  noise_file: "data/raw/no_WMT_news.parquet"
  # Titles are ~20 tokens each. Gemma 4 E2B has 131,072 positions; memory is the limit here.
  #noise_levels: [50, 100]
  noise_levels: [50, 100, 200, 300, 500, 1000]
  system: "You are a quantitative financial assistant. For the requested ticker, call get_stock_news tool, then generate your response."
  user: "Based only on the headlines, will the price target for {ticker} go up?"
  #user: "Based only on the headlines above, will the price target for {ticker} go up?"
  report: "Using only the tool results, answer as JSON: a confidence between 0 and 1, and a summary that directly answers what was asked."
  #report: "Using only the tool results above, answer as JSON: a confidence between 0 and 1, and a summary that directly answers what was asked."

request:
  prefill_only: true  # false = full generation, with max_tokens: null
  # TTFT is stamped when token max_tokens arrives (benchmark_impl.timed_stream_request).
  # Token 1: Qwen3 <think>, Gemma 4 <|channel>; both hidden by the reasoning parser.
  # Token 2: visible for Qwen3, still hidden for Gemma 4 (thought). It is a generated
  # token either way, so 2 gives prefill + 1 decode step for both models.
  max_tokens: 2
  enable_thinking: true

run:
  concurrencies: [1]
  reps: 3
  results_dir: "benchmarks/results"
