# TPOT: decode time per token, default engine, Gemma 4 E2B (text-only, 4-bit).
# Each max_tokens value is a separate request, stamped when token max_tokens arrives.
# Fit time vs max_tokens: slope = TPOT, intercept ~ prefill.
# Prompts match ttft-prefill-baseline-gemma4-e2b*.yaml, so intercepts compare with that fit.
# Quote strings: YAML reads unquoted ON/NO/YES/OFF as booleans.

server:
  model: "mlx-community/Gemma4-E2B-IT-Text-int4"
  tool_call_parser: "gemma4"
  reasoning_parser: "gemma4"
  serve_script: "benchmarks/serve.sh"
  ready_timeout_s: 300
  continuous_batching: false
  max_num_seqs: null            # needs continuous_batching
  prefix_cache: false           # true also drops the per-request cache-busting id
  kv_cache_quantization: false  # only takes effect with continuous_batching + prefix_cache
  kv_cache_quantization_bits: null

prompt:
  ticker: "AMZN"
  signal_file: "data/raw/AMZN_news.parquet"
  noise_file: "data/raw/no_AMZN_news.parquet"
  # Qwen3-4B TPOT levels plus 1000 (Gemma 4 E2B prefill completed at 1000 for both tickers).
  noise_levels: [50, 100, 200, 300, 500, 750, 1000]
  system: "You are a quantitative financial assistant. For the requested ticker, call get_stock_news tool, then generate your response."
  user: "Based only on the headlines above, will the price target for {ticker} go up?"
  report: "Using only the tool results above, answer as JSON: a confidence between 0 and 1, and a summary that directly answers what was asked."

request:
  prefill_only: true  # stop at max_tokens and stamp there
  # A row fails if the model stops before max_tokens (completion_tokens < max_tokens).
  # Gemma 4 thinks only when asked; with thinking on it should still be reasoning at 128 tokens. Check the error column.
  max_tokens: [2, 16, 32, 64, 128]
  enable_thinking: true

run:
  concurrencies: [1]
  reps: 3
  results_dir: "benchmarks/results"
