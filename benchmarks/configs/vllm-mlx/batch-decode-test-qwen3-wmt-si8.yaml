# Batch decode test, as batch-decode-test-qwen3-wmt.yaml but with stream_interval 8.
# At the default of 1 the server detokenises, parses and sends every token of every
# request separately. If that per-request work is why per-request TPOT grows with
# concurrency, TPOT at concurrency 4 drops here; if not, the cost is in the forward pass.
# max_tokens 2 and 128 both end on a final chunk, so the stamps are unaffected.
# Quote strings: YAML reads unquoted ON/NO/YES/OFF as booleans.

server:
  model: "mlx-community/Qwen3-4B-4bit"
  tool_call_parser: "qwen"
  reasoning_parser: "qwen3"
  serve_script: "benchmarks/serve.sh"
  ready_timeout_s: 300
  continuous_batching: true
  max_num_seqs: 8
  prefix_cache: false           # adds --disable-prefix-cache and the per-request cache-busting id
  kv_cache_quantization: false
  kv_cache_quantization_bits: null
  stream_interval: 8            # tokens per streamed chunk; null = vllm-mlx default (1)

prompt:
  ticker: "WMT"
  signal_file: "data/raw/WMT_news.parquet"
  noise_file: "data/raw/no_WMT_news.parquet"
  noise_levels: [0]
  system: "You are a quantitative financial assistant. For the requested ticker, call get_stock_news then your response."
  user: "Based only on the headlines above, will the price target for {ticker} go up?"
  report: "Using only the tool results above, answer as JSON: a confidence between 0 and 1, and a summary that directly answers what was asked."

request:
  prefill_only: true  # stop at max_tokens and stamp there
  # A row fails if the model stops before max_tokens (completion_tokens < max_tokens).
  max_tokens: [2, 128]
  enable_thinking: true

run:
  concurrencies: [1, 2, 4]
  reps: 2
  results_dir: "benchmarks/results"
