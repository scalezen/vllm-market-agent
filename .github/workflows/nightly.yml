name: nightly

on:
  schedule:
    - cron: '25 3 * * *'
  workflow_dispatch:

jobs:
  test-mcp-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install fastmcp openai yfinance pandas numpy loguru pytest
      - run: pytest tests/test_mcp_server.py -v
