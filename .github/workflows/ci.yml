name: ci

on:
  push:
    branches: [main]
    paths:
      - 'cpp/numprims/**'
      - 'python/numprims/**'
      - 'tests/test_numprims_similarity.py'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'cpp/numprims/**'
      - 'python/numprims/**'
      - 'tests/test_numprims_similarity.py'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  numprims:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pybind11 numpy pytest
      - run: cmake --preset default && cmake --build --preset default
        working-directory: cpp/numprims
      - run: python -c "import sys; sys.path.insert(0, 'python'); import numprims; assert 'native' in numprims.available_backends()"
      - run: pytest tests/test_numprims_similarity.py -v
