name: ci

on:
  push:
    branches: [main]
    paths:
      - 'cpp/numerical_primitives/**'
      - 'python/numerical_primitives/**'
      - 'tests/test_numerical_primitives_similarity.py'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'cpp/numerical_primitives/**'
      - 'python/numerical_primitives/**'
      - 'tests/test_numerical_primitives_similarity.py'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  numprims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pybind11 numpy pytest
      - run: cmake --preset default && cmake --build --preset default
        working-directory: cpp/numerical_primitives
      - run: python -c "import sys; sys.path.insert(0, 'python'); import numerical_primitives; assert 'native' in numerical_primitives.available_backends()"
      - run: pytest tests/test_numerical_primitives_similarity.py -v
