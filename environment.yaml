# Environment for vllm-market-agent (Apple Silicon / arm64 only).
#
# Create:  conda env create -f environment.yaml
# Update:  conda env update -f environment.yaml --prune
name: vllm-market-agent
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - pip
  # dev tooling (no compiled numeric dependencies)
  - pytest
  - ruff>=0.6
  - black>=24.0
  - mypy>=1.10
  - loguru
  - pip:
      - vllm-mlx   # brings mlx, mlx-lm, transformers, torch, torchvision
      - openai
      - yfinance
