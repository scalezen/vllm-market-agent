# Environment for vllm-market-agent (Apple Silicon / arm64 only).
# pyproject.toml is the full dependency list. This file adds what pip can't
# provide, and pre-installs the compiled packages from conda-forge so pip
# finds them already satisfied and skips them.
#
# Create (from the repo root):  conda env create -f environment.yaml
# Update:                       conda env update -f environment.yaml --prune
name: vllm-market-agent
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - pip
  - cxx-compiler
  - cmake>=3.20
  - numpy
  # pthreads, not OpenMP: pip's torch bundles its own libomp, and two OpenMP
  # runtimes in one process abort with "OMP: Error #15".
  - libopenblas=*=pthreads*
  - pandas
  - pyarrow
  - duckdb
  - pydantic
  - matplotlib
  - ipykernel   # the kernel VS Code's Jupyter extension runs notebooks in
  - pip:
      - -e .[serve,data,dev,notebooks]
